<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meridian — travel experiences built around you.">
  <title>Meridian — Travel Landing Page</title>

  <!-- Bootstrap 5.3.8 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
  >

  <!-- Project styles -->
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <!-- ==================== HEADER ==================== -->
  <header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-light bg-white py-3" aria-label="Main navigation">
      <div class="container">
        <a class="navbar-brand meridian-logo" href="#" aria-label="Meridian home">
          <span class="meridian-logo__mark">M</span>
          <span class="meridian-logo__text">
            <strong>MERIDIAN</strong>
            <small>TRAVEL &amp; JOURNEYS</small>
          </span>
        </a>

        <button
          class="navbar-toggler border-0 shadow-none"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavigation"
          aria-controls="mainNavigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav mx-auto align-items-lg-center gap-lg-4">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#destinations">Destinations</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#packages">Packages</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#stories">Stories</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#about">About</a>
            </li>
          </ul>

          <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-3 mt-3 mt-lg-0">
            <a class="header-phone" href="tel:+18005550199">
              <i class="bi bi-telephone me-2" aria-hidden="true"></i>
              +1 800 555 0199
            </a>
            <a class="btn btn-dark rounded-pill px-4 header-cta" href="#plan">
              Plan a trip
              <i class="bi bi-arrow-up-right ms-2" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- ==================== HERO (NEXT STEP) ==================== -->
  <main>
    <section class="hero-placeholder">
      <div class="container py-5">
        <p class="text-uppercase small fw-semibold letter-spacing mb-2">Trips built around you</p>
        <h1 class="display-3 fw-semibold mb-3">Discover somewhere worth remembering.</h1>
        <p class="lead text-secondary mb-0">Hero section will be implemented next.</p>
      </div>
    </section>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYJwR8J8YJwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
  <script src="./js/script.js"></script>
</body>
</html>
